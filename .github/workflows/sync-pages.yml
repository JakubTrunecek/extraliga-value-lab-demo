name: Sync public read-only app
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '11,41 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Test independent score audit
        run: node --test scripts/audit-model-public.test.mjs scripts/audit-goals-public.test.mjs
      - uses: actions/configure-pages@v5
      - name: Copy UI and fetch validated snapshot
        run: |
          mkdir -p _site
          cp -R site/. _site/
          node scripts/fetch-pages-snapshot.mjs _site
        env:
          SITE_BYPASS_TOKEN: ${{ secrets.SITE_BYPASS_TOKEN }}
          PAGES_EXPORT_TOKEN: ${{ secrets.PAGES_EXPORT_TOKEN }}
      - name: Verify exported model scores before publication
        run: node scripts/audit-model-public.mjs _site/data/live.json
      - name: Verify all goal lines before publication
        run: node scripts/audit-goals-public.mjs _site/data/live.json
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
